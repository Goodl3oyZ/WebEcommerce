# PRODUCTION stack (the server). Config files it mounts live in production/.
# Usage:
#   cp .env.production.example .env.production   # then fill in every value
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Only Caddy publishes ports (80/443). Postgres, Redis and SeaweedFS (S3 object
# storage) stay on the private network; Caddy serves public images at /media.

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-backend-env: &backend-env
  NODE_ENV: production
  BACKEND_PORT: "5000"
  TRUST_PROXY: "1"
  DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
  DB_SSL: "false" # traffic stays on the private Docker network
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
  # S3 client settings (MINIO_* names kept; any S3-compatible server works)
  MINIO_HOST: seaweedfs
  MINIO_API_PORT: "8333"
  MINIO_USE_SSL: "false"
  MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
  MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
  MINIO_PUBLIC_URL: https://${DOMAIN:?}/media
  FRONTEND_URL: https://${DOMAIN}
  API_URL: https://${DOMAIN}/api
  ALLOWED_ORIGINS: https://${DOMAIN}
  GITHUB_CALLBACK_URL: https://${DOMAIN}/oauth/github/callback
  GOOGLE_CALLBACK_URL: https://${DOMAIN}/oauth/google/callback
  FACEBOOK_CALLBACK_URL: https://${DOMAIN}/oauth/facebook/callback

services:
  caddy:
    image: caddy:2.8-alpine
    <<: [*restart, *logging]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./production/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./production/caddy/routes.caddy:/etc/caddy/routes.caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [web]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_OMISE_PUBLIC_KEY: ${OMISE_PUBLIC_KEY:?}
        NEXT_PUBLIC_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    <<: [*restart, *logging]
    environment:
      # Used by src/middleware.js to verify the accessToken cookie
      JWT_SECRET: ${JWT_SECRET:?}
      # Server-side requests (store name for page titles) go straight to the API
      BACKEND_URL: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    networks: [web]

  backend:
    build: ./backend
    <<: [*restart, *logging]
    env_file: .env.production
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    networks: [web, data]

  # One-shot schema sync before the API starts. Non-interactive: if a change
  # would drop data, drizzle-kit aborts and the API is not started.
  migrate:
    build: ./backend
    restart: "no"
    <<: *logging
    env_file: .env.production
    environment: *backend-env
    command: ["npx", "drizzle-kit", "push"]
    depends_on:
      db:
        condition: service_healthy
    networks: [data]

  db:
    image: postgres:15-alpine
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data]

  redis:
    image: redis:7-alpine
    <<: [*restart, *logging]
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [data]

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    <<: [*restart, *logging]
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /scripts/start.sh > /tmp/start.sh && exec /bin/sh /tmp/start.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./production/seaweedfs/start.sh:/scripts/start.sh:ro
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [web, data]

  # One-shot: creates the products/profiles/stores/reviews buckets, then exits.
  storage-init:
    build: ./backend
    restart: "no"
    <<: *logging
    env_file: .env.production
    environment: *backend-env
    command: ["node", "scripts/init-buckets.mjs"]
    depends_on:
      seaweedfs:
        condition: service_healthy
    networks: [data]

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
  caddy_data:
  caddy_config:

networks:
  web:
  data:
    internal: true
