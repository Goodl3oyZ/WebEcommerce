version: "3.8"

services:
  db:
    image: postgres:15
    container_name: flukedb-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net

  redis:
    image: redis:7-alpine
    container_name: flukeredis-dev
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - backend-net

  minio:
    image: minio/minio
    container_name: flukeminio-dev
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc
    container_name: minio-init-dev
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "tr -d '\\r' < /scripts/init-minio.sh > /tmp/init-minio.sh && chmod +x /tmp/init-minio.sh && /bin/sh /tmp/init-minio.sh",
      ]
    volumes:
      - ./scripts/init-minio.sh:/scripts/init-minio.sh
    networks:
      - backend-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: backend-dev
    environment:
      NODE_ENV: development
    ports:
      - "${BACKEND_PORT}:5000"
    volumes:
      # Mount source code for hot reload (จาก backend folder)
      - .:/app
      # Exclude node_modules to avoid conflicts
      - /app/node_modules
    depends_on:
      - db
      - redis
      - minio
      - minio-init
    networks:
      - backend-net
    # Enable hot reload with nodemon
    command: ["npm", "run", "dev"]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: frontend-dev
    environment:
      NODE_ENV: development
      # Add backend URL for API calls
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT}/api
      NEXT_PUBLIC_WS_URL: ws://backend-dev:5000
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      # Mount source code for hot reload (จาก backend folder ไป frontend)
      - ../frontend:/app
      # Exclude node_modules to avoid conflicts
      - /app/node_modules
      # Exclude .next to avoid conflicts
      - /app/.next
    depends_on:
      - backend
    networks:
      - backend-net
    # Enable hot reload with next dev
    command: ["npm", "run", "dev"]

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - db
    networks:
      - backend-net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  backend-net:
    driver: bridge
