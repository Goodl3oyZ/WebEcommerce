# LOCAL DEVELOPMENT ONLY (hot reload, source mounted, database ports open).
# Usage (from backend/): docker compose -f docker-compose.dev.yml up --build
# Not for servers: use docker-compose.prod.yml at the repo root (see DEPLOYMENT.md).
services:
  db:
    image: postgres:15
    container_name: flukedb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flukeredis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage, the same SeaweedFS image and start script as
  # production (MinIO's images are no longer published for servers). Served on
  # localhost:${MINIO_API_PORT} so image URLs look the same as before.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: fluke-storage
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /scripts/start.sh > /tmp/start.sh && exec /bin/sh /tmp/start.sh"]
    environment:
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:8333"
    volumes:
      - ../production/seaweedfs/start.sh:/scripts/start.sh:ro
      - seaweedfs_data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: backend
    env_file:
      - .env
    environment:
      NODE_ENV: development
      BACKEND_PORT: "5000"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/webecommerce
      REDIS_URL: redis://redis:6379
      MINIO_HOST: seaweedfs
      MINIO_API_PORT: "8333"
      # Browsers reach storage through the published port.
      MINIO_PUBLIC_URL: http://localhost:${MINIO_API_PORT}
      DB_SSL: "false"
    ports:
      - "${BACKEND_PORT}:5000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks:
      - backend-net
    restart: unless-stopped
    # --legacy-watch polls for changes: file events from a Windows/macOS host
    # folder do not reach the container, so plain watching never reloads.
    command: ["sh", "-c", "npm run migrate && npm run storage:init && nodemon --legacy-watch --watch src --ext js,json --exec \"node index.js\""]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    environment:
      NODE_ENV: development
      # Poll for file changes (host file events do not reach the container).
      WATCHPACK_POLLING: "true"
      JWT_SECRET: ${JWT_SECRET}
      BACKEND_URL: http://backend:5000
    ports:
      - "${FRONTEND_PORT}:3000"
    # webpack dev server: it honours WATCHPACK_POLLING; Turbopack's file
    # watcher misses changes made on a Windows/macOS host.
    command: ["npx", "next", "dev", "--webpack"]
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - backend-net
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:

networks:
  backend-net:
    driver: bridge
