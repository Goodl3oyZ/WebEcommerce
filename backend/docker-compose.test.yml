# TESTS ONLY: throwaway services for the integration test suite (npm test starts them).
# Data lives in tmpfs, so every `down` gives a clean slate.
name: webecommerce-test

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: webecommerce_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d webecommerce_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    entrypoint: ["/bin/sh", "-c", "tr -d '\r' < /scripts/start.sh > /tmp/start.sh && exec /bin/sh /tmp/start.sh"]
    environment:
      S3_ACCESS_KEY: testaccesskey
      S3_SECRET_KEY: testsecretkey123
    ports:
      - "58333:8333"
    volumes:
      - ../production/seaweedfs/start.sh:/scripts/start.sh:ro
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
